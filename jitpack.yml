jdk:
  - openjdk17
env:
  PACK: "aar"
  FOUT: "firestack.aar"
  FSRC: "firestack-sources.jar"
  NDKVER: "30.0.16248370"
  SDKVER: "37"
before_install:
# docs.jitpack.io/building
  - sdk install java 17.0.14-jbr
  - sdk use java 17.0.14-jbr
  - set -e
# jitpack "default" build image has no $ANDROID_HOME and no cmdline-tools
# at /opt/android-sdk-linux/cmdline-tools/latest/bin/sdkmanager, so the
# previous setup failed with "No such file or directory".
# Install self-contained Android command-line tools into $HOME instead;
# sdkmanager honors ANDROID_USER_HOME to relocate licenses & downloads
# (so we never write to a system sdk dir, which isn't writeable).
  - export ANDROID_USER_HOME="$HOME/.android"
  - mkdir -p "$ANDROID_USER_HOME"
  - export CLT="$HOME/clt"
  - rm -rf "$CLT" && mkdir -p "$CLT"
  - curl -Lso clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
  - unzip -q clt.zip -d "$CLT"
  - export SDKMGR="$CLT/cmdline-tools/bin/sdkmanager"
  - chmod +x "$SDKMGR"
# licenses must be accepted before platform/ndk installs succeed
  - yes | "$SDKMGR" --licenses > /dev/null
# gomobile requires a real android platform + build-tools; install them under $HOME
# developer.android.com/tools/sdkmanager
  - "$SDKMGR" "platforms;android-${SDKVER}" "build-tools;${SDKVER}.0.0"
# default ndk is at v27; also: github.com/jitpack/jitpack.io/issues/4638
# developer.android.com/ndk/downloads
  - "$SDKMGR" --install "ndk;${NDKVER}"
# point gomobile / make-aar at our private sdk; make-aar resolves the ndk as
# $ANDROID_HOME/ndk/$NDKVER which matches sdkmanager's default install location
  - export ANDROID_HOME="$CLT"
  - export ANDROID_SDK_ROOT="$CLT"
  - export PATH="$ANDROID_HOME/platform-tools:$PATH"
  - ./make-aar
install:
  - ./mvn-install

# cmds: jitpack.io/docs/BUILDING/#custom-commands
# envs: jitpack.io/docs/BUILDING/#environment-variables
# bout: github.com/celzero/outline-go-tun2socks/blob/88be3c35/Makefile#L13
# tool: developer.android.com/studio/releases/build-tools
# sdkm: developer.android.com/studio/command-line/sdkmanager
# ndkm: developer.android.com/ndk/downloads
# inst: github.com/wordpress-mobile/AztecEditor-Android/blob/5d983f8/jitpack.yml
